# PayLink CI
#
# Stage 1 (build-test):  restore -> lint -> build -> test + coverage report
# Stage 2 (docker):      build images -> start full stack -> health checks -> tear down
#
# Phase 2 adds Stage 3 (deploy): on main only, deploy to a self-hosted runner,
# run health checks, and roll back to the previous image tag on failure.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["phase-*", "final"]
  pull_request:
    branches: [main, devops]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PayLink.sln

      - name: Lint (formatting and code style)
        run: dotnet format PayLink.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build (warnings are errors)
        run: dotnet build PayLink.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test PayLink.sln
          --configuration Release --no-build
          --settings coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx"

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub;TextSummary

      - name: Publish coverage to job summary
        if: always()
        run: cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: TestResults/
          retention-days: 14

  docker:
    name: Docker images and stack smoke test
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack (db, mock billers, api)
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Health checks
        run: |
          set -e
          echo "API liveness:";      curl --fail --silent --show-error http://localhost:5080/health/live;  echo
          echo "API readiness (DB):"; curl --fail --silent --show-error http://localhost:5080/health/ready; echo
          echo "Mock billers:";      curl --fail --silent --show-error http://localhost:5090/health/live;  echo
          echo "OpenAPI document:";  curl --fail --silent --show-error --output /dev/null http://localhost:5080/swagger/v1/swagger.json && echo OK

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
